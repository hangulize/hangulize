aze: >
 아제르바이잔어는 튀르크어족에 속하는 언어로, 아제르바이잔과 이란 일부 지역에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. Ğ는 "ㅎ"으로 표기하고, x는 "흐"로 표기하며, q는 "그"로 표기합니다.

bel: >
 벨라루스어는 동슬라브어군에 속하는 언어로, 벨라루스의 공식 언어입니다. 이 언어는 키릴 문자를 사용합니다. ё는 "요"로 표기하고, х는 "흐"로 표기하며, ц는 "츠"로 표기하고, ч는 "치"로 표기합니다.

bul: >
 불가리아어는 남슬라브어군에 속하는 언어로, 불가리아의 공식 언어입니다. 이 언어는 키릴 문자를 사용합니다. ъ는 표기하지 않고, ё는 "요"로 표기하며, 자음 끝의 회음은 발음하지 않습니다.

cat: >
 카탈루냐어는 스페인 카탈루냐 지역과 발렌시아, 발레아레스 제도에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. ll은 "야"로 표기하고, ñ은 "녀"로 표기하며, ç는 "세"로 표기합니다.

ces: >
 체코어는 서슬라브어군에 속하는 언어로, 체코의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. č는 "치"로, ř는 "르"로, š는 "시"로, ž는 "주"로 표기하고, ě, ů는 "예"로 표기합니다.

chi: >
 중국어는 한자어를 한글 발음으로 표기하여 중국어 발음을 쉽게 익힐 수 있습니다. 이 언어는 한자를 사용합니다. 성조는 표기하지 않고, x는 "시"로, q는 "치"로, zh는 "쯔"로 표기하며, c는 "츠"로, z는 "즈"로 표기하고, r은 "르"로 표기하며, ü는 "위"로 표기하고, 자음 뒤의 i는 "이"로 표기하며(예: bi→비), 단어 끝의 n은 "ㄴ"으로, ng는 "ㅇ"으로 표기합니다.

cym: >
 웨일스어는 켈트어족에 속하는 언어로, 웨일스에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. w는 "웨"로 표기하고, y는 "이"로 표기하며, ll은 "흐"로, ch는 "흐"로, dd는 "더"로, ff는 "프"로 표기합니다.

deu: >
 독일어는 게르만어족에 속하는 언어로, 독일, 오스트리아, 스위스 등에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. 모음 ä, ö, ü는 각각 "에", "오", "위"로 표기하되, 단어 중간에서는 "애", "외", "의"로 표기하고, eu는 "오이"로, ie는 "이"로 표기하며, ch는 "히"로 표기하고(예: Bach→바흐), sch는 "슈"로 표기하고, z는 "츠"로, ss와 ß는 "스"로 표기하며, 단어 끝의 b, d, g는 각각 "프", "트", "크"로 표기하고, v는 "프"로 표기합니다.

ell: >
 그리스어는 현대 그리스어의 발음을 한글로 정확히 표기합니다. 이 언어는 그리스 문자를 사용합니다. οι는 "오"로, αι는 "아"로, ει는 "에"로, υ는 "이"로 표기하고, οιυ는 "오이"로 표기합니다.

epo: >
 에스페란토는 국제어로 만들어진 인공 언어로, 전 세계적으로 사용됩니다. 이 언어는 라틴 문자를 사용합니다. ĉ는 "치"로, ĝ는 "구"로, ĵ는 "주"로, ŝ는 "시"로, ŭ는 "으"로 표기합니다.

est: >
 에스토니아어는 핀우그르어족에 속하는 언어로, 에스토니아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. ä는 "애"로, ö는 "오"로, ü는 "위"로, õ는 "요"로 표기하고, š는 "시"로 표기합니다.

fin: >
 핀란드어는 핀우그르어족에 속하는 언어로, 핀란드의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. ä는 "애"로, ö는 "오"로 표기하고, kk는 "크"로, 길쌍자음은 단순자음으로 표기합니다.

grc: >
 고대 그리스어는 고전 그리스 문학과 철학 연구에 도움이 됩니다. 이 언어는 그리스 문자를 사용합니다. αι는 "아"로, ει는 "에"로, η는 "에"로, ου는 "우"로, υ는 "이"로, ω는 "오"로 표기하고, 류자음은 "르"로 표기합니다.

hbs: >
 세르보크로아트어는 세르비아, 크로아티아, 보스니아 등에서 사용되는 남슬라브어군 언어입니다. 이 언어는 키릴 문자 및 라틴 문자를 사용합니다. č는 "치"로, ć는 "치"로, đ는 "주"로, dž는 "쥐"로, lj는 "랴"로, nj는 "녀"로, š는 "시"로, ž는 "주"로 표기합니다.

hun: >
 헝가리어는 핀우그르어족에 속하는 언어로, 헝가리의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. cs는 "치"로, gy는 "디"로, ly는 "요"로, ny는 "녀"로, s는 "시"로, sz는 "스"로, ty는 "티"로, zs는 "즈"로 표기합니다.

isl: >
 아이슬란드어는 북게르만어군에 속하는 언어로, 아이슬란드의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. á는 "아"로, é는 "에"로, í는 "이"로, ó는 "오"로, ú는 "우"로, ð는 "으"로, æ는 "애"로, ö는 "오"로 표기하고, ll은 "흐"로 표기합니다.

ita: >
 이탈리아어는 로망스어족에 속하는 언어로, 이탈리아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. c는 e, i 앞에서 "치"로, 그 외에는 "크"로 표기하고, g는 e, i 앞에서 "지"로, 그 외에는 "게" 또는 "기"로 표기하며, gli는 "리"로 표기하고, sc는 "스"로 표기합니다.

jpn: >
 일본어는 히라가나, 가타카나, 한자를 포함한 일본어 발음을 한글로 표기합니다. 이 언어는 가나 문자 및 한자를 사용합니다. ち(치)는 "지"로, つ(츠)는 "쓰"로 표기하고, ふ(후)는 "후"로 표기하며, ゃ, ゅ, ょ는 각각 "야", "유", "요"로 표기하고, ん(응)은 받침 "ㄴ"으로 표기하며, 장모음 ㅏㅏ, ㅜㅜ 등은 "아", "우" 등으로 짧게 표기하고, っ(작은 쓰)는 뒤따라오는 자음을 겹쳐서 표기합니다(예: まって→마테).

jpn-ck: >
 일본어(오키나와)는 류큐어군에 속하는 일본어 방언으로, 표준 일본어와는 발음과 표기에서 차이가 있습니다. 이 언어는 가나 문자 및 한자를 사용합니다. 표준 일본어와 달리 ン(응) 발음이 다르고, 특유된 음운 체계를 가지며, 한글 표기 시 이러한 차이를 반영하여 표기합니다.

kat-1: >
 조지아어는 카르트벨리어족에 속하는 언어로, 조지아의 공식 언어입니다. 이 언어는 조지아 문자를 사용합니다. ა는 "아"로, ე는 "에"로, ი는 "이"로, ო는 "오"로, უ는 "우"로 표기하고, ღ는 "흐"로, შ는 "시"로, ჩ는 "치"로, ც는 "쯔"로, ძ는 "쯔"로 표기합니다.

kat-2: >
 조지아어(메그렐)는 카르트벨리어족에 속하는 조지아어 방언으로, 표준 조지아어와는 일부 음운과 표기에서 차이가 있습니다. 이 언어는 조지아 문자를 사용합니다. 표준 조지아어와 달리 특정 자음 조합과 모음 발음 차이를 보이며, 한글 표기 시 이러한 방언적 특성을 반영합니다.

lat: >
 라틴어는 고전 라틴어 발음을 한글로 표기하여 라틴어 학습에 도움을 줍니다. 이 언어는 라틴 문자를 사용합니다. ae는 "아에"로, oe는 "오에"로 표기하고, c는 e, i, y 앞에서 "크"로, 그 외에는 "크"로 표기하며, ti는 "티"로 표기합니다.

lav: >
 라트비아어는 발트어족에 속하는 언어로, 라트비아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. č는 "치"로, ģ는 "구"로, ļ는 "랴"로, ņ는 "녀"로, š는 "시"로, ž는 "주"로 표기합니다.

lit: >
 리투아니아어는 발트어족에 속하는 언어로, 리투아니아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. į는 "이"로, š는 "시"로 표기하고, io는 "요"로 표기합니다.

mkd: >
 마케도니아어는 남슬라브어군에 속하는 언어로, 북마케도니아의 공식 언어입니다. 이 언어는 키릴 문자를 사용합니다. ѓ는 "쇼"로 표기하고, ј는 "요"로 표기합니다.

nld: >
 네덜란드어는 게르만어족에 속하는 언어로, 네덜란드와 벨기에 일부 지역에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. sch는 "스흐"로 표기하고, ij는 "에이"로 표기합니다.

pol: >
 폴란드어는 서슬라브어군에 속하는 언어로, 폴란드의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. ą은 "온"으로, ę은 "엔"으로, ć는 "치"로, ł는 "우"로, ś는 "시"로, ź는 "지"로, ż는 "주"로 표기하고, cz는 "치"로 표기합니다.

por: >
 포르투갈어는 로망스어족에 속하는 언어로, 포르투갈과 브라질 등에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. ç는 "세"로, lh는 "랴"로, nh는 "녀"로 표기하고, s는 "스"로 표기합니다.

por-br: >
 포르투갈어(브라질)는 브라질에서 사용되는 포르투갈어 방언으로, 표준 포르투갈어와는 발음과 어휘에서 차이가 있습니다. 이 언어는 라틴 문자를 사용합니다. 표준 포르투갈어와 달리 r, l 끝음을 자음화하지 않고, 표현을 "테"로, 디 "지"로, 동사 어미 "-ar"을 "-아르"로 표기하며, 브라질 특유적인 철자 표기법을 반영합니다.

ron: >
 루마니아어는 로망스어족에 속하는 언어로, 루마니아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. ă는 "아"로, â는 "암"으로, î는 "임"으로 표기하고, ş는 "시"로, ț는 "츠"로 표기합니다.

rus: >
 러시아어는 동슬라브어군에 속하는 언어로, 러시아의 공식 언어입니다. 이 언어는 키릴 문자를 사용합니다. ъ(경음 기호)와 ь(연음 기호)는 표기하지 않고, ё는 "요"로 표기하며, е는 자음 앞에서 "예"로, 단어 처음에서는 "예"로 표기하고, в는 단어 끝에서 "프"로, 그 외에는 "브"로 표기하며, б, г, д, к, п, т, ф, х는 단어 끝에서 무성음으로 발음되어 각각 "프", "크", "트", "크", "프", "트", "프", "크", "크"로 표기하고, ж, ш, щ는 "시"로, ц는 "츠"로, ч는 "치"로 표기하며, ю, я는 각각 "유", "야"로 표기합니다.

slk: >
 슬로바키아어는 서슬라브어군에 속하는 언어로, 슬로바키아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. ä는 "애"로, č는 "치"로, ň는 "녀"로, š는 "시"로, ž는 "주"로 표기하고, ô는 "오"로 표기합니다.

slv: >
 슬로베니아어는 남슬라브어군에 속하는 언어로, 슬로베니아의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. č는 "치"로, š는 "시"로, ž는 "주"로 표기합니다.

spa: >
 스페인어는 로망스어족에 속하는 언어로, 스페인과 라틴아메리카 여러 국가에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. h는 발음하지 않으므로 표기하지 않고, j는 "ㅎ"으로 표기되어 조합에 따라 "호", "헤" 등이 되며(예: José→호세), ll은 "야" 또는 "리"로 표기하고, ñ은 "녀"로 표기하며, c는 e, i 앞에서 "스"로, 그 외에는 "크"로 표기하고, g는 e, i 앞에서 "헤" 또는 "히"로, 그 외에는 "게" 또는 "기"로 표기하며, qu는 "크"로 표기하고, z는 "스"로, v는 "브"로 표기합니다.

sqi: >
 알바니아어는 인도유럽어족에 속하는 언어로, 알바니아와 코소보 등에서 사용됩니다. 이 언어는 라틴 문자를 사용합니다. ë는 "으"로, ç는 "치"로 표기합니다.

swe: >
 스웨덴어는 북게르만어군에 속하는 언어로, 스웨덴의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. cj는 "시"로, sj는 "슈"로 표기합니다.

tur: >
 터키어는 튀르크어족에 속하는 언어로, 터키의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. ç는 "치"로, ğ는 "으"로, ş는 "시"로, ı는 "이"로 표기하고, ğ은 뒤에 오면 "으"를 붙이고, 뒤에 오면 "으"를 붙입니다.

ukr: >
 우크라이나어는 동슬라브어군에 속하는 언어로, 우크라이나의 공식 언어입니다. 이 언어는 키릴 문자를 사용합니다. г는 "흐"로 표기하고, є는 "예"로 표기하며, і는 "이"로 표기하고, ґ는 "요"로 표기합니다.

vie: >
 베트남어는 오스트로아시아어족에 속하는 언어로, 베트남의 공식 언어입니다. 이 언어는 라틴 문자를 사용합니다. â는 "암"으로, đ는 "주"로 표기하고, ô는 "오"로 표기합니다.

wlm: >
 중세 웨일스어는 중세 시기의 웨일스어 발음을 표기합니다. 이 언어는 라틴 문자를 사용합니다. 현대 웨일스어와 달리 중세 웨일스어 특유의 철자와 발음 체계를 가지며, 이러한 중세적 특성을 한글 표기에 반영합니다.
